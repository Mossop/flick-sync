name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Also caches the build, reports compiler, clippy and rustfmt problems
      # as annotations, and makes warnings fail the build (RUSTFLAGS is set
      # to "-D warnings").
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy

      # rustfmt.toml uses options that are only available on nightly.
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal --component rustfmt --allow-downgrade

      - name: Cargo check
        run: cargo check --all-features

      - name: Clippy
        run: cargo clippy --all-features

      - name: Rustfmt
        run: cargo +nightly fmt --check

      - name: Run tests
        run: cargo test --all-features
