{% extends "sidebar.html" %}

{% block title %}Sync List{% endblock %}

{% block content %}
<sl-card>
  <div id="synclist-header">
    <div>
      Available disk space: <sl-format-bytes value="{{ available_space }}"></sl-format-bytes>
    </div>
    <sl-icon-button hx-post="/start_sync" hx-swap="none" library="material" name="sync" label="Sync now"></sl-icon-button>
  </div>
</sl-card>

<div id="server-cards" hx-target="this" sse-swap="sync-change" hx-swap="morph:innerHTML">
  {% include "syncservers.html" %}
</div>
{% endblock %}
