{% extends "sidebar.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
  <div id="video-container">
    <video-player
      currentTime="{{ playback_position }}"
      server="{{ server }}"
      video="{{ video }}"
      image="{{ image }}"
      url="{{ url }}"
      mimeType="{{ mime_type }}"
      duration="{{ total_duration }}"
    >
      <sl-menu slot="cast-devices" hx-target="this" hx-swap="innerHTML" sse-swap="cast-devices">
        {{ cast_devices|safe }}
      </sl-menu>
    </video-player>
  </div>
{% endblock %}
